name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7, pinned from the official v7 tag.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        # actions/setup-go v7, pinned from the official v7 tag.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release tag and documentation
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid Wavo release tag: $tag"
            exit 1
          fi
          version="${tag#v}"
          core_and_pre="${version%%+*}"
          if [[ "$core_and_pre" == *-* ]]; then
            prerelease="${core_and_pre#*-}"
            IFS=. read -ra identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && ${#identifier} -gt 1 && "$identifier" == 0* ]]; then
                echo "::error::Numeric prerelease identifiers cannot have leading zeroes"
                exit 1
              fi
            done
          fi
          grep -Fq "## [$version] - " CHANGELOG.md
          grep -Fq "WAVO_VERSION=$tag" README.md
          grep -Fq "WAVO_VERSION=$tag" docs/BETA.md

      - name: Wavo branding gate
        run: |
          ./scripts/check-branding.sh
          ./scripts/check-branding-test.sh
          ./scripts/check-docs.sh
          ./scripts/check-docs-test.sh
          ./scripts/update-swagger-test.sh
          mkdir -p ./bin
          go build -trimpath -o ./bin/wavo ./cmd/wavo
          ./scripts/check-branding.sh ./bin/wavo

      - name: Validate installer
        run: |
          sh -n install.sh
          shellcheck install.sh scripts/install-test.sh
          ./scripts/install-test.sh

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        # actions/checkout v7, pinned from the official v7 tag.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        # actions/setup-go v7, pinned from the official v7 tag.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Write outside the working tree so the repo stays clean for GoReleaser.
          awk -v ver="$version" '
            # Stop at the next version heading or the link-reference footer.
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            /^## \[/ && index($0, "[" ver "]") { found=1; next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release_notes.md"
          if [ ! -s "$RUNNER_TEMP/release_notes.md" ]; then
            echo "::error::No CHANGELOG.md section found for version $version"
            exit 1
          fi
          echo "----- release notes for $version -----"
          cat "$RUNNER_TEMP/release_notes.md"

      - name: Run GoReleaser
        # goreleaser/goreleaser-action v7, pinned from the official v7 tag.
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: "2.15.4"
          args: release --clean --release-notes=${{ runner.temp }}/release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
