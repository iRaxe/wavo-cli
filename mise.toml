[tools]
go = "1.26.6"
watchexec = "latest"
"aqua:golangci/golangci-lint" = "latest"

[tasks.build]
description = "Build the CLI"
run = "mkdir -p ./bin && go build -o ./bin/wavo ./cmd/wavo/"

[tasks.dev]
description = "Auto-build on Go file changes (dev profile: separate config + keyring)"
run = "mkdir -p ./bin && watchexec -e go --restart --debounce 300 -- go build -tags dev -o ./bin/wavo ./cmd/wavo/"

[tasks.lint]
description = "Run golangci-lint across the module"
run = "golangci-lint run ./..."

[tasks.cover]
description = "Run tests with coverage report"
run = "go test -coverprofile=coverage.out ./... && go tool cover -func=coverage.out"

[tasks."cover:html"]
description = "Open coverage report in browser"
depends = ["cover"]
run = "go tool cover -html=coverage.out"

[tasks."sdk:update-swagger"]
description = "Refresh the bundled Wavo Swagger contract from a local source checkout"
run = "./scripts/update-swagger.sh"

[tasks.agents]
description = "Create AGENTS.md symlinks to CLAUDE.md in all module directories"
run = """
find . -name "CLAUDE.md" -type f -print0 | while IFS= read -r -d '' file; do
  dir=$(dirname "$file")
  ln -sf CLAUDE.md "$dir/AGENTS.md"
  echo "Created symlink: $dir/AGENTS.md -> CLAUDE.md"
done
"""
